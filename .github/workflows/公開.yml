name: 公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 公開
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿取得
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 実行環境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 依存関係の取得
        run: bun install
      - name: 構築
        run: bun run build
      - name: 公開設定
        uses: actions/configure-pages@v5
      - name: 公開物の送信
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4

